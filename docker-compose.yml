version: '3.8'

services:
  smartboxai:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartboxai-frontend
    restart: always
    labels:
      # Включить для Traefik
      - "traefik.enable=true"
      # Правило маршрутизации (замените на ваш домен)
      - "traefik.http.routers.smartboxai.rule=Host(`smartboxai.ru`)"
      # Entry points
      - "traefik.http.routers.smartboxai.entrypoints=web,websecure"
      # TLS сертификат
      - "traefik.http.routers.smartboxai.tls=true"
      - "traefik.http.routers.smartboxai.tls.certresolver=mytlschallenge"
      # Порт сервиса
      - "traefik.http.services.smartboxai.loadbalancer.server.port=80"
    networks:
      - n8n_default

networks:
  n8n_default:
    external: true
